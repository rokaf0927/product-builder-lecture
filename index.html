<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추천</title>
    <link rel="stylesheet" href="style.css">
    <!-- Excel 파일을 읽기 위한 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>로또 번호 추천기</h1>
        <p>'로또 회차별 당첨번호.xlsx' 파일을 자동으로 읽어 과거 데이터를 분석하고 추천 번호를 생성합니다.</p>
        
        <button id="generate-btn" disabled>추천 번호 생성</button>
        <div id="result" class="result-container">
            <!-- 추천 번호가 여기에 표시됩니다. -->
        </div>

        <div class="past-data-section">
            <h2>과거 랜덤 당첨번호 10</h2>
            <div id="past-data-container">
                <p>데이터를 불러오는 중입니다...</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
